# Optional deployment with Docker Compose.
#   1. Create .env next to this file with:  POSTGRES_PASSWORD=<strong password>
#   2. Put rasednet.crt / rasednet.key in ./certs  (python -m rasednet gen-cert --out-dir certs)
#   3. docker compose up -d
#      The app auto-runs init-db and seeds a standard admin (admin / RasedNet@2026);
#      you must change that password on first sign-in. For an extra named admin:
#      docker compose exec app python -m rasednet create-admin --username <name>
# Note: `network_mode: host` is required for ARP/MAC visibility of the local segment (Linux hosts only).
# On Docker Desktop (Windows/macOS) the scanner sees the VM network, so MAC addresses are not observable.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rasednet
      POSTGRES_DB: rasednet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasednet -d rasednet"]
      interval: 10s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    environment:
      RASEDNET_DATABASE_URL: postgresql+psycopg://rasednet:${POSTGRES_PASSWORD}@127.0.0.1:5432/rasednet
      RASEDNET_COOKIE_SECURE: "true"
    volumes:
      - ./certs:/certs:ro
volumes:
  pgdata:
