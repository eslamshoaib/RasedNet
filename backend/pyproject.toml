[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rasednet"
version = "0.15.0"
description = "RasedNet — offline, Arabic-first network discovery and security assessment platform"
requires-python = ">=3.12"
# Exact versions verified by the test-suite live in requirements.lock (pinned, no hashes yet).

[project.scripts]
rasednet = "rasednet.cli:main"

[tool.setuptools.packages.find]
include = ["rasednet*"]

[tool.setuptools.package-data]
"rasednet.migrations" = ["script.py.mako", "versions/*.py"]
