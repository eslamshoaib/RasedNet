# Used only by the `alembic` CLI for development (e.g. `alembic revision --autogenerate`).
# The URL is taken from RASEDNET_DATABASE_URL by rasednet/migrations/env.py.
[alembic]
script_location = rasednet:migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
