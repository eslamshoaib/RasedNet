[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rased"
version = "0.15.0"
description = "RASED — offline, Arabic-first network discovery and security assessment platform"
requires-python = ">=3.12"
# Exact versions verified by the test-suite live in requirements.lock (pinned, no hashes yet).

[project.scripts]
rased = "rased.cli:main"

[tool.setuptools.packages.find]
include = ["rased*"]

[tool.setuptools.package-data]
"rased.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["rased/migrations/versions"]  # auto-generated Alembic revisions

[tool.ruff.lint]
# Pragmatic, security-aware rule set for production code.
select = ["E", "F", "W", "I", "B", "S", "UP", "C4"]
ignore = [
    "E501",    # long lines (Arabic strings); line-length is advisory here
    "E702",    # intentional compact single-line statements
    "B008",    # FastAPI uses function calls (Depends/Query) in argument defaults by design
    "B905",    # zip(): explicit strict= not required for our equal-length pairs
    "S101",    # asserts (tests only)
    "S104",    # "0.0.0.0" are route-table string literals (gateway detection), not socket binds
    "S105", "S106",  # false positives on fields/params literally named "password"/"community"
    "S110", "S112",  # intentional, documented defensive try/except on optional enrichment
    "S310",    # outbound HTTP clients to operator-provided/asset addresses (reviewed)
    "S311",    # non-crypto randomness (jitter/ids), never used for secrets
    "S603", "S607",  # subprocess with list args + resolved exe names (ping/arp) — no shell, no injection
    "S604",    # the dataclass field named "shell" (command metadata), not a real shell=True call
    "UP046",   # keep the explicit Generic base (clearer than PEP 695 here)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402"]

[tool.bandit]
# Accepted / reviewed categories for this authorised network-administration tool.
# Real security-relevant spots (SSH exec, outbound URL) are annotated inline with `# nosec`.
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert — not used in production paths
    "B104",  # "0.0.0.0" are route-table string literals (gateway detection), not socket binds
    "B105", "B106",  # false positives on fields/params literally named "password"
    "B110", "B112",  # intentional, documented defensive try/except on optional enrichment
    "B404", "B603",  # subprocess invoked with argument lists (no shell) and resolved executables
    "B604",  # the dataclass field named "shell" (command metadata), not a real shell=True call
]
