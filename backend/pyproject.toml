[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rased"
version = "0.15.0"
description = "RASED — offline, Arabic-first network discovery and security assessment platform"
requires-python = ">=3.12"
# Exact versions verified by the test-suite live in requirements.lock (pinned, no hashes yet).

[project.scripts]
rased = "rased.cli:main"

[tool.setuptools.packages.find]
include = ["rased*"]

[tool.setuptools.package-data]
"rased.migrations" = ["script.py.mako", "versions/*.py"]
